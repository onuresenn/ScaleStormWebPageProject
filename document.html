<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="download">İndir</title>

  <!-- Bu sayfaya özel stil -->
  <link rel="stylesheet" href="css/document.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="icon" type="image/png" href="assets/logo.png">
</head>

<body class="download-page">
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">
      <a href="index.html">
        <img src="assets/logo.png" alt="Runotech Logo" />
        <span>RUNOTECH</span>
      </a>
    </div>
    <nav>
      <a href="index.html" data-i18n="home">Ana Sayfa</a>
      <a href="products.html" data-i18n="products">Ürünler</a>
      <a href="contact.html" data-i18n="contact">İletişim</a>
      <a href="document.html" data-i18n="download" class="active">İndir</a>
      <div class="language-selector">
        <button class="lang-btn" data-lang="tr" title="Türkçe">
          <img src="assets/tr.png" alt="Türkçe"/>
        </button>
        <button class="lang-btn" data-lang="en" title="English">
          <img src="assets/en.png" alt="English"/>
        </button>
      </div>
    </nav>
  </header>

  <main class="page-content">
    <!-- Sayfa başlığı -->
    <section class="page-hero">
      <h1 data-i18n="pageTitle">İndirmeler</h1>
      <p data-i18n="pageDesc">
        Kurulum dosyaları ve dokümanlara aşağıdan ulaşabilirsiniz.
      </p>
    </section>

    <!-- Kartlar -->
    <section class="download-cards">
      <div class="download-card">
        <i class="fas fa-file-pdf"></i>
        <h3 data-i18n="docTitle">Doküman</h3>
        <p data-i18n="docDesc">Kullanım kılavuzu ve kurulum notları</p>
        <a href="downloads/manual.pdf" class="download-btn" download data-i18n="docBtn">📄 PDF İndir</a>
      </div>

      <div class="download-card">
        <i class="fas fa-cogs"></i>
        <h3 data-i18n="setupTitle">Setup</h3>
        <p data-i18n="setupDesc">Scalemaster kurulum dosyası</p>
        <a href="downloads/setup.exe" class="download-btn" download data-i18n="setupBtn">⚙️ Kurulum İndir</a>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 RUNOTECH</p>
  </footer>

  <!-- Script -->
  <script src="js/script.js"></script>
</body>
</html>
